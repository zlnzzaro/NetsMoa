name: netogether

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: netogether
      POSTGRES_USER: netogether
      POSTGRES_PASSWORD: netogether_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: